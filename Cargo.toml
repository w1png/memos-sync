[package]
name = "memos"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
similar = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
